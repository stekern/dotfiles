set -g default-terminal "tmux-256color"
set -g default-shell "$SHELL"

set -g prefix C-b
bind C-b send-prefix

bind d detach
bind : command-prompt
bind Tab rotate-window

set -g allow-passthrough on     # tmux ≥ 3.3
set -g focus-events on          # needed for nvim FocusGained/FocusLost

#######################
#                     #
# Better defaults     #
#                     #
#######################
# Use a large scrollback limit
set -g history-limit 10000

# Enable mouse support (e.g., for selecting pane using mouse)
set -g mouse on

# Increase timeout when displaying pane numbers using `tmux display-panes`
set -g display-panes-time 2000

# Automatically update window numbers to be sequential
set -g renumber-windows on

# Start window numbering at 1
set -g base-index 1

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Allow for faster key repetition
set -g escape-time 0

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Disable automatic renaming
set -g allow-rename off


#######################
#                     #
# Theming             #
#                     #
#######################
# Status bar theming
set -g status-interval 1
set -g status-justify centre
set -g status-left-length 30
set -g status-left '#[fg=green,bright]#h #[fg=blue]| #[fg=red]♥ #(if test "$(uname -s)" = "Darwin"; then pmset -g batt | sed -n "s/^.*\t\{1,\}\([0-9]\{1,\}\)%.*$/\1/p"; fi)%'
set -g status-right '  '

# Grey out non-active panes
set -g window-style 'bg=colour18'
set -g window-active-style 'bg=colour0'
 
# Set the color of the pane borders
set -g status-bg colour19
set -g pane-border-style 'fg=colour19,bg=colour19'
set -g pane-active-border-style 'fg=colour19,bg=colour19'
set -g pane-border-status off

set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W #{?#{||:#{window_zoomed_flag},#{pane_synchronized}},\[\#{?window_zoomed_flag,+,}#{?pane_synchronized,~,}\] ,}"
set -g window-status-style 'fg=colour18,bg=colour7'
set -g window-status-current-style 'fg=colour18,bold,bg=colour04'
set -g window-status-activity-style 'fg=default,italics'
set -g message-style 'fg=colour7,bold,bg=colour19'


#######################
#                     #
# Keybindings         #
#                     #
#######################

# Toggle base16 theme (dark ↔ light) — requires toggle-theme function in shell rc
# Uses split-window so OSC sequences pass through tmux to the terminal emulator
bind-key t split-window -l 1 'zsh -ic toggle-theme'

# With prefix, [g]it
bind-key g display-popup -E -d "#{pane_current_path}" -xC -yC -w 80% -h 75% "lazygit"

bind-key -n M-p last-pane # mnemonic: previous
bind-key -n M-P last-window # mnemonic: previous

# Vim copypaste mode
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe 'pbcopy' \; send -X clear-selection
bind-key -T copy-mode-vi Escape if-shell -F "#{selection_present}" \
    "send -X clear-selection" \
    "send -X cancel"
# copy-pipe instead of copy-pipe-and-cancel, clear selection after copy

bind-key -n M-s copy-mode # [s]croll
bind-key -n M-S copy-mode \; send-keys # [s]earch

bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
#bind-key -n M-9 select-window -t :{end} # Works in 2.6, but not 3.1
bind-key -n M-9 run-shell "tmux select-window -t :\"$(tmux list-windows | tail -1 | sed 's/:.*//')\""
bind-key -n M-J select-window -n # previous windows
bind-key -n M-K select-window -p # next window

# [r]ename window
bind-key -n M-R run-shell '\
  cd "#{pane_current_path}"; \
  CURRENT_DIR="$(basename "#{pane_current_path}")"; \
  if git rev-parse --show-toplevel > /dev/null 2>&1; then \
    REPO_NAME="$(basename $(git rev-parse --show-toplevel))"; \
    if [ "$REPO_NAME" != "$CURRENT_DIR" ]; then \
      tmux display-menu -T "[ #[fg=red]Rename window#[default] ]" \
        "$REPO_NAME" "" "rename-window \"$REPO_NAME\"" \
        "$CURRENT_DIR" "" "rename-window \"$CURRENT_DIR\"" \
        "Custon name..." "" "command-prompt -p \"New name: \" \"rename-window %%\""; \
    else \
      tmux display-menu -T "[ #[fg=red]Rename window#[default] ]" \
        "$CURRENT_DIR" "" "rename-window \"$CURRENT_DIR\"" \
        "Custom name..." "" "command-prompt -p \"New name: \" \"rename-window %%\""; \
    fi; \
  else \
      tmux display-menu -T "[ #[fg=red]Rename window#[default] ]" \
      "$CURRENT_DIR" "" "rename-window \"$CURRENT_DIR\"" \
      "Custom name..." "" "command-prompt -p \"New name: \" \"rename-window %%\""; \
  fi'

# [n]ew window
bind-key -n M-n new-window -c "#{pane_current_path}" -a -t "{next}"
bind-key -n M-N command-prompt -p "New window: " "new-window -n '%%' -c '#{pane_current_path}'"

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Use current directory for new panes and windows
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key -n M-= next-layout # Balance panes and cycle predefined window layouts

# [d]uplicate command to all panes in current window
bind -n M-d setw synchronize-panes

# [d]efault layout
# Create or balance three-pane layout (70-30 vertical with right side split horizontally)
bind -n M-D run-shell '\
  PANE_COUNT=$(tmux list-panes | wc -l); \
  if [ "$PANE_COUNT" -gt 3 ]; then \
    tmux display-message "Default layout requires a three-pane window"; \
    exit 0; \
  fi; \
  CURRENT_PANE=$(tmux display-message -p "#{pane_index}"); \
  if [ "$PANE_COUNT" -eq 1 ]; then \
    tmux split-window -h -p 30 -c "#{pane_current_path}"; \
    tmux select-pane -t 2; \
    tmux split-window -v -p 50 -c "#{pane_current_path}"; \
  elif [ "$PANE_COUNT" -eq 2 ]; then \
    tmux select-layout main-vertical; \
    tmux select-pane -t 1; \
    tmux resize-pane -t 1 -x 30%; \
    tmux select-pane -t 2; \
    tmux split-window -v -p 50 -c "#{pane_current_path}"; \
  else \
    tmux select-layout main-vertical; \
    tmux select-pane -t 1; \
    tmux resize-pane -t 1 -x 30%; \
    tmux select-pane -t 2; \
    tmux resize-pane -y 50%; \
  fi; \
  tmux select-pane -t "$CURRENT_PANE"'

# [i]dentical layout
# Create a new window using current window layout
if-shell -b '[ -f "$HOME/code/personal/scripts/tmux/copy_layout.sh" ]' " \
    bind-key -n M-I run '"$HOME"/code/personal/scripts/tmux/copy_layout.sh'"

# [f]ind panes by process
bind-key -n M-F display-popup -E -xC -yC -w 80% -h 75% "(echo '.  WINDOW  PROCESS  CWD'; tmux list-panes -s -F '#{window_index}.#{pane_index}  #{window_name}  #{pane_current_command}  #{pane_current_path}' | sort -n) | column -t | fzf --header-lines=1 --with-nth=2.. --preview='tmux capture-pane -t {1} -p' --preview-window=right:50% | awk '{print \$1}' | xargs -I{} tmux select-window -t {} \\; select-pane -t {}"

# [a]gents
bind-key -n M-A display-popup -E -xC -yC -w 80% -h 75% "python $HOME/code/personal/tmux-llm-ui/claude_loader.py"


# [f]ull screen pane
bind-key -n M-f resize-pane -Z

# kill
bind-key -n M-X confirm-before "kill-window"

# [c]ycle panes
bind-key -n M-c swap-pane -U

# [o]verview
bind-key -n M-o display-panes
# Note: -Z flag is not supported for tmux 2.6 (likely only version >= 3)
# bind-key -n M-O run-shell 'tmux choose-tree -Z -wf"##{==:##{session_name},#{session_name}}"'
# bind-key -n M-O run-shell 'tmux choose-tree -Z -w'
bind-key -n M-O display-popup -E -xC -yC -w 80% -h 75% "tmux list-windows -F '#I: #W' | awk '{printf \"%-3s %s\\n\", \$1, \$2}' | sort -rn | fzf --height=~50% | awk '{print \$1}' | cut -d: -f1 | xargs tmux select-window -t"

# tmux < 3
#bind-key -n M-H swap-window -t -1 # Move window to the left
#bind-key -n M-L swap-window -t +1 # Move window to the right

# tmux >= 3
bind-key -n M-H swap-window -d -t -1 # Move window to the left
bind-key -n M-L swap-window -d -t +1 # Move window to the right

# [m]ove current window to another session
bind-key -n M-M run -C 'display-menu -T "[ #[fg=red]Move window to session#[default] ]" #{S:#S "" "move-window -t #S ; display-message -d 2000 \"Window moved to session '\''#S'\''\"" }'


#######################
#                     #
# vim-tmux-navigator  #
#                     #
#######################
# https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'
bind-key -n 'M-p' if-shell "$is_vim" 'send-keys M-p'  'select-pane -l'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
