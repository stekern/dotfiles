shell_integration       no_cursor

font_family             Operator Mono Lig Book
bold_font               Operator Mono Lig Medium
italic_font             Operator Mono Lig Book Italic
bold_italic_font        Operator Mono Lig Medium Italic

font_size               15.0
map ctrl+plus           change_font_size current +2.0
map ctrl+minus          change_font_size current -2.0
map ctrl+0              change_font_size all 15.0

remember_window_size    no
initial_window_width    640
initial_window_height   500

macos_option_as_alt     left
confirm_os_window_close 1

# cmd+c defaults to copy_or_noop, which passes the key through when nothing is
# selected; tmux reads kitty's super bit (8) as Meta and fires its M-c binding.
map cmd+c               copy_to_clipboard

# Same leak, and these two hit destructive tmux bindings (kill-window, sync-panes)
map cmd+shift+x         no_op
map cmd+d               no_op
